<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>あそびのもり</title>
<meta name="description" content="あそびながら かしこくなる。よめなくても あそべる ちいさな こどもの ゲームランド。">
<meta name="theme-color" content="#9fd16a">
<link rel="icon" href="assets/icons/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link href="assets/fonts/fonts.css" rel="stylesheet">
<style>
:root{
  --paper:#fff7ea; --paper2:#ffeccd;
  --ink:#5b4022; --ink-soft:#7c5d39; --ink-faint:#a98c66;
  --honey:#ffb43d; --honey-d:#f59312; --honey-l:#ffdb95;
  --r:30px; --r-sm:20px;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{ -webkit-text-size-adjust:100%;
  min-height:100%;
  background:#cdeab2 url("assets/menu/bg.webp") center top / cover no-repeat fixed;
}
body{
  font-family:'M PLUS Rounded 1c',sans-serif; color:var(--ink);
  position:relative; overflow-x:hidden; background:transparent;
  max-width:600px; margin:0 auto;
  padding:0 16px calc(26px + env(safe-area-inset-bottom));
}
/* readability scrim: clear sky up top, soft cream wash lower down so cards/text pop */
.scrim{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(180deg,
    rgba(255,253,245,0) 0%, rgba(255,253,245,0) 22%,
    rgba(255,250,236,.28) 46%, rgba(255,247,230,.5) 74%, rgba(255,245,226,.62) 100%);}
.screen{position:relative;z-index:1;max-width:600px;margin:0 auto;}

/* ===== SETTINGS BUTTON（右上のBGM音符と同じく fixed で追従。こちらは左上） ===== */
.iconbtn{position:fixed;z-index:9999;
  top:calc(8px + env(safe-area-inset-top));
  left:calc(10px + env(safe-area-inset-left));
  border:none;background:none;cursor:pointer;padding:0;line-height:0;
  transition:transform .14s var(--ease);filter:drop-shadow(0 5px 6px rgba(80,55,15,.32));}
.iconbtn img{width:50px;height:50px;display:block;}
.iconbtn:active{transform:translateY(3px) scale(.94);}

/* ===== HERO ===== */
.hero{position:relative;text-align:center;padding-top:calc(58px + env(safe-area-inset-top));}
.logo-img{display:block;margin:0 auto;width:min(74%,392px);height:auto;
  filter:drop-shadow(0 10px 12px rgba(90,55,15,.35));}
.tagline{margin-top:2px;display:inline-flex;align-items:center;gap:7px;
  font-weight:800;font-size:14.5px;color:var(--ink-soft);
  background:rgba(255,255,255,.94); padding:7px 18px;border-radius:999px;
  box-shadow:0 5px 0 rgba(150,110,60,.18), inset 0 2px 0 #fff;}
.tagline .star{width:15px;height:15px;background:var(--honey);
  clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
  box-shadow:0 1px 0 #d9913a;}

/* hero unicorns standing on the path */
.cast{position:relative;height:182px;margin-top:8px;}
.cast img{position:absolute;bottom:0;filter:drop-shadow(0 12px 8px rgba(90,55,15,.32));}
.cast .blue{height:178px;left:50%;transform:translateX(-50%);z-index:3;animation:bob 3s var(--ease) infinite;}
.cast .green{height:120px;left:6%;bottom:4px;z-index:2;animation:bobSide 3.4s var(--ease) infinite .3s;}
.cast .purple{height:122px;right:5%;bottom:2px;z-index:2;animation:bobSide 3.2s var(--ease) infinite .6s;}
.cast .pad{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);
  width:38%;max-width:170px;height:20px;border-radius:50%;background:rgba(110,80,40,.18);filter:blur(7px);}
@keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-9px)}}
/* じぶんの ユニコーン（おへやで きせかえした すがた。タップで おへやへ） */
.cast .me{position:absolute;bottom:0;left:50%;z-index:3;width:calc(178px * 258 / 374);cursor:pointer;
  border:none;background:none;padding:0;animation:bob 3s var(--ease) infinite;}
.cast .me .bd{position:relative;width:100%;z-index:0;}
.cast .me img.uni{position:static;display:block;width:100%;height:auto;filter:drop-shadow(0 12px 8px rgba(90,55,15,.32));}
.cast .me .acc{position:absolute;transform:translate(-50%,-50%);pointer-events:none;}
.cast .me .acc img{position:static;display:block;width:100%;height:auto;filter:drop-shadow(0 2px 2px rgba(80,45,10,.22));}
.cast .me .blush-css{position:relative;width:100%;padding-top:30%;}
.cast .me .blush-css i{position:absolute;top:0;width:32%;height:100%;border-radius:50%;
  background:radial-gradient(circle,#ff8fae 0%,rgba(255,143,174,.65) 45%,rgba(255,143,174,0) 72%);}
.cast .me .blush-css i:first-child{left:1%}.cast .me .blush-css i:last-child{right:1%}
/* ぼうしを かぶっているときは キャッチコピーに かさならないよう すこし さげる */
.cast.hat{margin-top:30px;}
/* スマホ縦：ヒーローを ちいさくして「きょうの 3つ」を はやく見せる */
@media (orientation:portrait) and (max-width:520px){
  .hero{padding-top:calc(50px + env(safe-area-inset-top));}
  .logo-img{width:min(62%,330px);}
  .tagline{font-size:13px;padding:5px 14px;}
  .cast{height:146px;margin-top:4px;}
  .cast.hat{margin-top:26px;}
  .cast .blue{height:142px;}
  .cast .me{width:calc(142px * 258 / 374);}
  .cast .green{height:96px;}
  .cast .purple{height:98px;}
}
@keyframes bobSide{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@media (prefers-reduced-motion: reduce){ .cast img,.cast .me{animation:none!important;} }

/* ===== おへや 入口 ===== */
.room-entry{position:relative;display:flex;align-items:center;gap:13px;width:100%;
  margin:16px 0 2px;border:none;cursor:pointer;text-align:left;color:inherit;font:inherit;
  background:linear-gradient(180deg,#fff3da,#ffe6bf);border-radius:24px;padding:13px 16px;
  box-shadow:0 14px 24px -12px rgba(120,75,20,.5),0 3px 0 rgba(120,80,30,.12),
    inset 0 3px 0 rgba(255,255,255,.9),inset 0 -8px 14px rgba(190,150,90,.14);
  transition:transform .16s var(--ease),box-shadow .16s var(--ease);}
.room-entry:active{transform:translateY(4px) scale(.99);
  box-shadow:0 7px 14px -10px rgba(120,75,20,.5),inset 0 3px 0 rgba(255,255,255,.9);}
.room-entry .door{flex:0 0 auto;width:52px;height:54px;position:relative;}
.room-entry .door .roof{position:absolute;left:50%;top:0;transform:translateX(-50%);
  width:0;height:0;border-left:28px solid transparent;border-right:28px solid transparent;
  border-bottom:18px solid #d98a4e;filter:drop-shadow(0 2px 0 #b56a30);}
.room-entry .door .wall{position:absolute;left:50%;bottom:0;transform:translateX(-50%);
  width:42px;height:38px;background:linear-gradient(180deg,#ffd89a,#f5b96a);border-radius:7px 7px 5px 5px;
  box-shadow:inset 0 2px 0 #fff7;}
.room-entry .door .wall::after{content:"";position:absolute;left:50%;bottom:0;transform:translateX(-50%);
  width:16px;height:22px;background:#9a6420;border-radius:8px 8px 0 0;}
.room-entry .txt{flex:1;min-width:0;}
.room-entry .txt b{display:block;font-family:'Mochiy Pop One';font-size:16px;color:var(--ink);}
.room-entry .txt span{font-size:12px;font-weight:800;color:var(--ink-soft);}
.room-entry .count{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;
  font-family:'Mochiy Pop One';font-size:16px;color:#9a6420;
  background:#fffdf7;padding:7px 13px 7px 9px;border-radius:999px;box-shadow:inset 0 2px 0 #fff,0 3px 0 rgba(150,100,40,.18);}
.room-entry .acorn{position:relative;width:20px;height:22px;display:inline-block;}
.room-entry .acorn .cap{position:absolute;top:0;left:0;width:20px;height:10px;border-radius:10px 10px 4px 4px;
  background:linear-gradient(180deg,#a9712f,#7d4f17);}
.room-entry .acorn .nut{position:absolute;bottom:0;left:2px;width:16px;height:14px;
  border-radius:8px 8px 8px 8px/6px 6px 11px 11px;background:linear-gradient(180deg,#e6b25a,#cf8b2c);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.4);}
.room-entry .bell{position:absolute;top:-7px;right:-6px;min-width:26px;height:26px;padding:0 6px;
  border-radius:999px;background:linear-gradient(180deg,#ff7a8f,#ec5168);color:#fff;
  font-family:'Mochiy Pop One';font-size:15px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 0 #c93b50;animation:bell 1s ease-in-out infinite;}
@keyframes bell{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.room-entry .bell[hidden]{display:none;}
@media (prefers-reduced-motion: reduce){ .room-entry .bell{animation:none;} }

/* ===== SECTION HEADER ===== */
.shelf-h{display:inline-flex;align-items:center;gap:9px;margin:18px auto 14px;
  font-family:'Mochiy Pop One';font-size:16px;color:var(--ink);
  background:rgba(255,255,255,.9);padding:8px 18px;border-radius:999px;
  box-shadow:0 4px 0 rgba(150,110,60,.16), inset 0 2px 0 #fff;}
.shelf-wrap{text-align:center;}
.shelf-h .dot{width:13px;height:13px;border-radius:50%;background:var(--honey);
  box-shadow:0 2px 0 #d9913a, inset 0 2px 0 rgba(255,255,255,.6);}

/* ===== CLAY CARD ===== */
.card{
  position:relative;border-radius:var(--r);background:#fffdf7;border:none;
  text-align:left;width:100%;cursor:pointer;display:block;color:inherit;font:inherit;
  box-shadow:
    0 18px 30px -14px rgba(90,55,15,.5),
    0 3px 0 rgba(120,80,30,.12),
    inset 0 3px 0 rgba(255,255,255,.95),
    inset 0 -10px 16px rgba(190,150,90,.12);
  transition:transform .16s var(--ease), box-shadow .16s var(--ease);
}
.card:active{transform:translateY(4px) scale(.985);
  box-shadow:0 9px 16px -10px rgba(90,55,15,.5),inset 0 3px 0 rgba(255,255,255,.95),inset 0 -10px 16px rgba(190,150,90,.12);}
.art{position:relative;overflow:hidden;background:#f3ead7;}
.art img.scene{width:100%;height:100%;object-fit:cover;display:block;}
.art::after{content:"";position:absolute;inset:0;
  background:radial-gradient(120% 70% at 50% 0,rgba(255,255,255,.35),transparent 60%);
  pointer-events:none;}

/* game-name banner sticker（本文先頭にブロック配置。見切れない）
   ※ width/height:auto＋max-* で常にアスペクト比を保つ＝絶対に横へ伸び縮みさせない。
     max-width:100% で画面幅が狭くても比率を保ったままカード内に必ず収める。 */
.banner{position:relative;z-index:4;display:block;align-self:flex-start;
  width:auto;height:auto;max-width:100%;max-height:38px;
  filter:drop-shadow(0 5px 6px rgba(60,40,10,.4));transform:rotate(-1.5deg);
  transform-origin:left center;}

.desc{font-size:12.5px;font-weight:700;color:var(--ink-soft);line-height:1.5;}
.play{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;
  font-family:'Mochiy Pop One';font-size:14.5px;color:#fff;
  background:linear-gradient(180deg,var(--ac,#ffb43d),var(--ac-d,#f59312));
  padding:9px 18px;border-radius:999px;
  box-shadow:0 5px 0 var(--ac-sh,#d9851f), inset 0 2px 0 rgba(255,255,255,.45);}
.play .tri{width:0;height:0;border-left:11px solid #fff;border-top:7px solid transparent;border-bottom:7px solid transparent;}
.prog{display:flex;align-items:center;gap:8px;}
.prog .bar{flex:1;height:11px;border-radius:9px;background:#f0e2c6;overflow:hidden;
  box-shadow:inset 0 2px 3px rgba(150,110,60,.25);}
.prog .bar i{display:block;height:100%;border-radius:9px;
  background:linear-gradient(90deg,var(--honey-l),var(--honey));transition:width .6s var(--ease);}
.prog .pct{font-size:12px;font-weight:800;color:var(--ink-faint);min-width:40px;text-align:right;}
.tagrow{display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.tag{font-size:11.5px;font-weight:800;color:var(--ac-d);white-space:nowrap;
  background:var(--ac-soft,#ffe9c6);padding:3px 11px;border-radius:999px;}
.best{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;color:var(--ink-soft);white-space:nowrap;}
.best .star{width:12px;height:12px;background:var(--honey);
  clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);}
.ribbon{position:absolute;top:12px;right:-4px;z-index:5;
  font-family:'Mochiy Pop One';font-size:11.5px;color:#fff;
  background:linear-gradient(180deg,#ff8a5c,#ee5f33);padding:5px 12px;
  border-radius:999px 6px 6px 999px;box-shadow:0 5px 0 #c8491f, inset 0 2px 0 rgba(255,255,255,.35);}

/* feature card: text left, scene right */
.feature{display:flex;align-items:stretch;margin-bottom:14px;overflow:hidden;min-height:182px;}
.feature .body{flex:1;min-width:0;padding:16px 12px 16px 18px;display:flex;flex-direction:column;gap:9px;justify-content:center;}
.feature .art{flex:0 0 44%;align-self:stretch;border-radius:0 var(--r) var(--r) 0;}
.feature .banner{max-height:40px;margin:0 0 2px -2px;}
.feature .desc{padding-right:4px;}

/* grid: scene top, text bottom */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:360px){ .grid{gap:11px;} }
/* 横画面（タブレット優先）：横幅を活かして広げ、ゲームは4列に＝スクロールを減らす */
@media (orientation:landscape) and (min-width:720px){
  .screen{max-width:960px;}
  .grid{grid-template-columns:repeat(4,1fr);}
  /* 横画面はヒーローをコンパクトにして、あそびのカードを早く見せる */
  .hero{padding-top:calc(16px + env(safe-area-inset-top));}
  .logo-img{width:min(46%,300px);}
  .cast{height:128px;}
  .cast img{max-height:118px;}
}
.grid .card{display:flex;flex-direction:column;}
.grid .art{aspect-ratio:4/3;border-radius:var(--r) var(--r) 0 0;}
.grid .body{padding:12px 13px 14px;display:flex;flex-direction:column;gap:7px;}
/* 看板はアート下端に少し重ねる（上にはみ出す＝本文ボックスは clip しないので見える） */
.grid .banner{max-height:34px;margin:-26px 0 6px -2px;transform:rotate(-2deg);}

/* entrance */
.enter{opacity:0;transform:translateY(14px);animation:rise .5s var(--ease) forwards;}
.enter.d1{animation-delay:.05s}.enter.d2{animation-delay:.12s}.enter.d3{animation-delay:.19s}
.enter.d4{animation-delay:.26s}.enter.d5{animation-delay:.33s}.enter.d6{animation-delay:.40s}
@keyframes rise{to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){ .enter{opacity:1;transform:none;animation:none;} }

/* footer */
.foot{margin-top:24px;text-align:center;}
.credit{font-size:11px;color:var(--ink-soft);font-weight:700;
  background:rgba(255,255,255,.55);display:inline-block;padding:5px 14px;border-radius:999px;}


/* ===== きょうの 3つ（まいにちの スタンプ） ===== */
.today{position:relative;overflow:hidden;margin:14px 0 4px;padding:14px 14px 12px;border-radius:26px;
  background:linear-gradient(180deg,#fffaf0,#fff1d6);
  box-shadow:0 16px 28px -14px rgba(120,75,20,.5),0 3px 0 rgba(120,80,30,.12),
    inset 0 3px 0 rgba(255,255,255,.95),inset 0 -8px 14px rgba(190,150,90,.14);}
.today-h{display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
.today-h b{font-family:'Mochiy Pop One';font-size:17px;color:var(--ink);}
.today-h .sun{width:26px;height:26px;border-radius:50%;flex:0 0 auto;
  background:radial-gradient(circle at 40% 35%,#fff3b0,#ffc83d 60%,#f59f12);
  box-shadow:0 0 0 4px rgba(255,200,61,.25),0 2px 0 #d9851f;}
.today-h .sub{font-size:12px;font-weight:800;color:var(--ink-soft);margin-left:auto;}
.today-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:11px;}
.tslot{position:relative;border:none;padding:0;cursor:pointer;background:none;font:inherit;color:inherit;
  border-radius:20px;transition:transform .16s var(--ease);}
.tslot:active{transform:translateY(3px) scale(.97);}
.tslot .pic{display:block;position:relative;aspect-ratio:1/1;border-radius:20px;overflow:hidden;
  background:#f3ead7;box-shadow:0 7px 0 var(--ac-sh,#d9851f),0 12px 18px -8px rgba(90,55,15,.45),inset 0 2px 0 rgba(255,255,255,.6);}
.tslot .pic img{width:100%;height:100%;object-fit:cover;display:block;}
.tslot .nm{display:block;margin-top:10px;font-family:'Mochiy Pop One';font-size:12.5px;color:var(--ac-d,#9a6420);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;}
.tslot .stamp{position:absolute;right:-6px;top:-8px;width:40%;aspect-ratio:1;z-index:2;
  border-radius:50%;background:rgba(255,255,255,.6);border:3px dashed rgba(214,180,120,.75);
  display:flex;align-items:center;justify-content:center;}
.tslot .stamp img{width:118%;height:118%;object-fit:contain;opacity:0;}
.tslot.done .stamp{background:none;border-color:transparent;}
.tslot.done .stamp img{opacity:1;transform:none;}
.tslot.pop .stamp img{animation:stampIn .7s cubic-bezier(.34,1.56,.64,1) both;}
.tslot.done .pic::after{content:"";position:absolute;inset:0;background:rgba(255,255,255,.18);}
@keyframes stampIn{from{opacity:0;transform:scale(2.4) rotate(-40deg)}to{opacity:1;transform:none}}
.week{display:flex;justify-content:center;gap:6px;margin-top:12px;}
.week .d{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:800;color:var(--ink-faint);min-width:30px;}
.week .d i{width:24px;height:24px;border-radius:50%;background:#f0e2c6;box-shadow:inset 0 2px 3px rgba(150,110,60,.22);
  background-size:cover;background-position:center;}
.week .d.has i{background-color:transparent;box-shadow:none;}
.week .d.part i{opacity:.55;}
.week .d.now{color:var(--ink);}
.week .d.now i{outline:3px solid var(--honey);outline-offset:2px;}
.acorn-mini{width:14px;height:15px;display:inline-block;position:relative;}
.acorn-mini::before{content:"";position:absolute;top:0;left:0;width:14px;height:7px;border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,#a9712f,#7d4f17);}
.acorn-mini::after{content:"";position:absolute;bottom:0;left:1.5px;width:11px;height:10px;border-radius:6px 6px 6px 6px/4px 4px 8px 8px;background:linear-gradient(180deg,#e6b25a,#cf8b2c);}
.today .bonus{display:inline-flex;align-items:center;gap:5px;font-family:'Mochiy Pop One';font-size:12.5px;color:#9a6420;
  background:#fffdf7;padding:4px 11px 4px 8px;border-radius:999px;box-shadow:inset 0 2px 0 #fff,0 2px 0 rgba(150,100,40,.18);}
@media (prefers-reduced-motion: reduce){ .tslot.pop .stamp img{animation:none;} }

/* ===== おうちの ひと パネル ===== */
.pset{text-align:left;margin:4px 0 16px;display:flex;flex-direction:column;gap:14px;}
.pset h3{font-family:'Mochiy Pop One';font-size:14px;color:var(--ink);margin-bottom:7px;}
.pset .note{font-size:12px;font-weight:700;color:var(--ink-faint);margin-top:6px;}
.seg{display:flex;flex-wrap:wrap;gap:6px;}
#segLimit{display:grid;grid-template-columns:repeat(5,1fr);}
#segLimit button{font-size:12.5px;padding:8px 2px;white-space:nowrap;}
.dlg .seg button{min-width:0;}
.dlg .seg button{flex:1 1 auto;min-width:52px;min-height:44px;padding:8px 6px;font-size:14px;
  background:#f6eddc;color:var(--ink-soft);box-shadow:0 3px 0 rgba(150,110,60,.2);}
.dlg .seg button.on{background:linear-gradient(180deg,var(--honey),var(--honey-d));color:#fff;box-shadow:0 3px 0 #d9851f;}

/* ===== dialogs ===== */
.ovl{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
  background:rgba(50,35,15,.46);backdrop-filter:blur(2px);padding:24px;}
.ovl[hidden]{display:none;}
.dlg{background:#fffdf7;border-radius:28px;max-width:340px;width:100%;padding:24px 22px;text-align:center;
  max-height:calc(100dvh - 32px);overflow-y:auto;
  box-shadow:0 26px 50px -16px rgba(90,55,15,.6),inset 0 3px 0 rgba(255,255,255,.95);
  animation:pop .28s var(--ease);}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.dlg .ic{width:60px;height:60px;margin:0 auto 10px;}
.dlg .ic img{width:100%;height:100%;}
.dlg h2{font-family:'Mochiy Pop One';font-size:21px;color:var(--ink);margin-bottom:8px;}

/* くまゲームの進捗（独自キー）。重複混入でも水増ししないよう一意化して数える */
function kumaCleared(){
  try{
    const d = JSON.parse(localStorage.getItem('kuma_prog_save_v1'));
    if(!d || !Array.isArray(d.cleared)) return 0;
    return new Set(d.cleared).size;
  }catch(e){ return 0; }
}
/* クリアした いちばん たかい レベル（自由移動で とびとびクリアも あるため） */
function kumaBestLevel(){
  try{
    const d = JSON.parse(localStorage.getItem('kuma_prog_save_v1'));
    if(!d || !Array.isArray(d.cleared) || !d.cleared.length) return 0;
    const ns = d.cleared.map(Number).filter(n=>!isNaN(n));
    return ns.length ? Math.max(...ns)+1 : 0;
  }catch(e){ return 0; }
}
/* 各ゲームの進捗値（Save が無い環境では 0） */
function progressOf(g){
  if(!g.ns) return 0;
  try{ if(window.Save && Save.game) return Save.game(g.ns).get(g.progressKey,0); }catch(e){}
  // save.js が無い環境用の直読みフォールバック（キーは save.js の PREFIX と同じ）
  try{ return JSON.parse(localStorage.getItem('asobinomori:'+g.ns)||'{}')[g.progressKey]||0; }catch(e){}
  return 0;
}

function navTo(href, g, ev){
  try{ if(window.Sfx&&Sfx.pop) Sfx.pop(); }catch(e){}
  try{
    if(window.FX&&FX.ring){ const t=ev.currentTarget.getBoundingClientRect();
      FX.ring(t.left+t.width/2, t.top+t.height/2, {color:g.ac, vr:7, life:24}); }
  }catch(e){}
  if(window.App&&App.go){ try{ App.go(href); return; }catch(e){} }
  setTimeout(()=>{ location.href = href; }, 110);
}

function makeCard(g, i){
  const card = document.createElement('button');
  card.className = 'card enter d'+Math.min(i+2,6) + (g.feature?' feature':'');
  card.setAttribute('aria-label', g.name+' で あそぶ');
  card.style.setProperty('--ac', g.ac);
  card.style.setProperty('--ac-d', g.acd);
  card.style.setProperty('--ac-sh', g.acsh);
  card.style.setProperty('--ac-soft', g.acsoft);

  // 進捗 / メタ
  let meta = '';
  if(g.feature && g.total){
    const done = Math.min(kumaCleared(), g.total);
    const pct = Math.round(done/g.total*100);
    const bl = Math.min(kumaBestLevel(), g.total);
    meta = `<div class="prog" role="img" aria-label="${done} / ${g.total} クリア">
              <div class="bar"><i style="width:${pct}%"></i></div>
              <span class="pct">${done}/${g.total}</span></div>` +
           (bl>0 ? `<div class="tagrow"><span class="best"><span class="star"></span>さいこう レベル${bl}</span></div>` : '');
  } else if(g.tag){
    const v = progressOf(g);
    const label = g.bestLabel ? g.bestLabel(v) : null;
    meta = `<div class="tagrow"><span class="tag">${g.tag}</span>` +
           (label ? `<span class="best"><span class="star"></span>${label}</span>` : '') +
           `</div>`;
  }

  const playOrTag = g.feature
    ? `<span class="play"><span class="tri"></span> あそぶ</span>`
    : '';

  const bannerImg = `<img class="banner" src="${g.banner}" alt="${g.name}" draggable="false">`;
  const ribbon = g.ribbon ? `<span class="ribbon">${g.ribbon}</span>` : '';

  if(g.feature){
    // body 左（看板は本文の先頭にブロック配置＝見切れない） / art 右（ribbon は右上）
    card.innerHTML =
      `<div class="body">
         ${bannerImg}
         <div class="desc">${g.desc}</div>
         ${meta}
         ${playOrTag}
       </div>` +
      `<div class="art">
         <img class="scene" src="${g.scene}" alt="" draggable="false">
         ${ribbon}
       </div>`;
  } else {
    // art 上 / body 下（看板は本文先頭にブロック配置＝アート下端に重ねつつ見切れない）
    card.innerHTML =
      `<div class="art">
         <img class="scene" src="${g.scene}" alt="" draggable="false">
         ${ribbon}
       </div>` +
      `<div class="body">
         ${bannerImg}
         <div class="desc">${g.desc}</div>
         ${meta}
       </div>`;
  }

  card.addEventListener('click', (ev)=>navTo(g.href, g, ev));
  return card;
}

function sfx(n){ try{ if(window.Sfx&&Sfx[n]) Sfx[n](); }catch(e){} }
/* ===== きょうの 3つ（まいにちの スタンプ） ===== */
const STAMP = 'assets/menu/stamp.webp';
function renderToday(){
  if(!window.Rewards || !Rewards.daily) return;
  let st; try{ st = Rewards.daily(); }catch(e){ return; }
  const box = document.getElementById('today'); box.hidden = false;
  const row = document.getElementById('todayRow'); row.innerHTML = '';
  // まえに見たときより増えた スタンプは ポン！と押す演出
  let seen = 0; try{ seen = +sessionStorage.getItem('amori_seen_'+st.date) || 0; }catch(e){}
  st.picks.forEach((id,i)=>{
    const g = GAMES.find(x=>x.id===id); if(!g) return;
    const done = st.done.indexOf(id) >= 0;
    const b = document.createElement('button');
    b.className = 'tslot' + (done ? ' done' : '');
    b.style.setProperty('--ac-sh', g.acsh); b.style.setProperty('--ac-d', g.acd);
    b.setAttribute('aria-label', g.name + (done ? '（スタンプ あり）' : '') + ' で あそぶ');
    b.innerHTML = `<span class="pic"><img src="${g.scene}" alt="" draggable="false"></span>
      <span class="stamp" aria-hidden="true"><img src="${STAMP}" alt="" draggable="false"></span>
      <span class="nm">${g.name}</span>`;
    b.addEventListener('click', ev=>navTo(g.href, g, ev));
    row.appendChild(b);
  });
  const newly = st.done.length > seen;
  if(newly){
    const slots = [...row.children].filter(x=>x.classList.contains('done'));
    slots.forEach((x,i)=>{ if(i >= seen){ x.classList.add('pop'); x.querySelector('.stamp img').style.animationDelay = (0.5 + (i-seen)*0.35)+'s'; } });
    setTimeout(()=>{ sfx('pop'); try{ const r=slots[slots.length-1].getBoundingClientRect(); FX.sparkles(r.left+r.width*.8, r.top+10); }catch(e){} }, 650);
  }
  try{ sessionStorage.setItem('amori_seen_'+st.date, st.done.length); }catch(e){}
  const left = st.picks.length - st.done.length;
  document.getElementById('todaySub').innerHTML = st.complete
    ? 'ぜんぶ できた！ また あしたね'
    : `<span class="bonus"><span class="acorn-mini"></span>あと ${left}つで どんぐり ＋${st.bonus}</span>`;
  // あそんだ ひ（さいきんの 7にち）
  const days = Rewards.stampDays ? Rewards.stampDays() : {};
  const W = ['にち','げつ','か','すい','もく','きん','ど'];
  const wk = document.getElementById('week'); wk.innerHTML = '';
  for(let k=6;k>=0;k--){
    const d = new Date(); d.setDate(d.getDate()-k);
    const key = d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
    const n = days[key] || 0;
    const c = document.createElement('span');
    c.className = 'd' + (n ? ' has' : '') + (n && n<3 ? ' part' : '') + (k===0 ? ' now' : '');
    c.innerHTML = `<i style="${n ? `background-image:url(${STAMP})` : ''}"></i>${W[d.getDay()]}`;
    wk.appendChild(c);
  }
  // 3つ そろった日は1回だけ ボーナス
  if(st.complete && !st.bonusGiven){
    setTimeout(()=>{
      if(!Rewards.claimDaily()) return;
      try{ Sfx.fanfare(); }catch(e){}
      try{ FX.confetti(); }catch(e){}
      try{ const r = box.getBoundingClientRect(); FX.acornGain(st.bonus, r.left+r.width/2, r.top+r.height/2); }catch(e){}
      try{ if(window.Talk) Talk.say('ぜんぶ できた！ どんぐり ' + st.bonus + 'こ ゲット！'); }catch(e){}
      refreshRoom();
    }, newly ? 1500 : 700);
  }
}

/* ===== ホームの じぶんの ユニコーン（きせかえ中なら その すがたで） ===== */
(function dressHero(){
  if(!window.Rewards || !Rewards.PLACE) return;
  let w = {}; try{ w = Rewards.wear(); }catch(e){}
  const cats = ['neck','face','hat'].filter(c=>w[c]);
  if(!cats.length) return;
  let pos = {}; try{ pos = Save.game('room').get('pos', {}) || {}; }catch(e){}
  const img = id => id==='face_blush' ? '<div class="blush-css"><i></i><i></i></div>'
                                       : `<img src="assets/items/${id}.webp" alt="" draggable="false">`;
  let acc = '';
  cats.forEach(cat=>{
    const id = w[cat], p = Rewards.PLACE[id] || {cx:50,cy:30,w:50}, c = pos[id];
    const st = `left:${c?c.x:p.cx}%;top:${c?c.y:p.cy}%;width:${p.w}%;`;
    if(p.wrap){
      acc += `<div class="acc" style="${st}z-index:-1">${img(id)}</div>`;
      acc += `<div class="acc" style="${st}z-index:3">${img(id).replace('<img ', `<img style="clip-path:${p.wrap};-webkit-clip-path:${p.wrap}" `)}</div>`;
    } else acc += `<div class="acc" style="${st}z-index:2">${img(id)}</div>`;
  });
  const old = document.querySelector('.cast .blue'); if(!old) return;
  if(w.hat) document.querySelector('.cast').classList.add('hat');   // ぼうしの ぶん うえを あける
  const me = document.createElement('button');
  me.className = 'me'; me.setAttribute('aria-label','わたしの ユニコーン（おへやへ）');
  me.innerHTML = `<div class="bd"><img class="uni" src="assets/uni/blue_standing.webp" alt="" draggable="false">${acc}</div>`;
  me.addEventListener('click', ()=>document.getElementById('roomEntry').click());
  old.replaceWith(me);
})();

/* ===== おへや 入口（どんぐり残数・くじ通知） ===== */
(function(){
  const entry = document.getElementById('roomEntry');
  if(!entry) return;
  // どんぐり残数・くじ通知（Rewards が無い環境でも入口ナビは生かす）
  refreshRoom();
  entry.addEventListener('click', (ev)=>{
    try{ if(window.Sfx&&Sfx.pop) Sfx.pop(); }catch(e){}
    try{ if(window.FX&&FX.ring){ const t=ev.currentTarget.getBoundingClientRect();
      FX.ring(t.left+t.width/2, t.top+t.height/2, {color:'#c0832f', vr:7, life:24}); } }catch(e){}
    if(window.App&&App.go){ try{ App.go('room.html'); return; }catch(e){} }
    setTimeout(()=>{ location.href='room.html'; }, 110);
  });
})();
function refreshRoom(){
  try{
    if(window.Rewards){
      document.getElementById('roomCount').textContent = Rewards.balance();
      const canDraw = Rewards.canDraw();
      const bell = document.getElementById('roomBell');
      bell.hidden = !canDraw;
      document.getElementById('roomSub').textContent =
        Rewards.allCollected() ? 'ごほうびを ぜんぶ あつめたよ！'
        : canDraw ? 'くじが ひけるよ！みに いこう'
        : 'どんぐりを ためて くじを ひこう';
    }
  }catch(e){}
}

function openParent(){ syncParent(); ovlSet.hidden = false; }
document.getElementById('btnSettings').addEventListener('click', ()=>{
  sfx('tap');
  if(window.Guard && Guard.gate) Guard.gate(openParent); else openParent();
});
function syncParent(){
  const lim = window.Guard ? Guard.limit : 0;
  document.querySelectorAll('#segLimit button').forEach(b=>b.classList.toggle('on', +b.dataset.m===lim));
  const used = window.Guard ? Guard.usedMin() : 0;
  const rem = window.Guard ? Guard.remainingMin() : Infinity;
  document.getElementById('usedNote').textContent = 'きょう あそんだ じかん：' + used + 'ふん' +
    (lim && rem!==Infinity ? '（のこり ' + rem + 'ふん）' : '');
  const on = !(window.Sfx && Sfx.enabled===false);
  document.querySelectorAll('#segSfx button').forEach(b=>b.classList.toggle('on', (b.dataset.v==='1')===on));
  const T = window.Talk;
  const ok = T && T.supported;
  document.querySelectorAll('#segTalk button').forEach(b=>{ b.disabled = !ok; b.classList.toggle('on', ok && (b.dataset.v==='1')===T.enabled); });
  document.getElementById('talkNote').textContent = ok
    ? 'ヒントを こえで よみあげます（ヒントを タップしても よめます）'
    : 'この たんまつでは よみあげが つかえません';
}
document.getElementById('segLimit').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b||!window.Guard) return;
  sfx('tap'); Guard.setLimit(+b.dataset.m); syncParent();
});
document.getElementById('segSfx').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b||!window.Sfx||!Sfx.setEnabled) return;
  Sfx.setEnabled(b.dataset.v==='1'); sfx('tap'); syncParent();
});
document.getElementById('segTalk').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b||!window.Talk) return;
  sfx('tap'); Talk.setEnabled(b.dataset.v==='1'); syncParent();
  if(Talk.enabled) Talk.say('こえの あんない オン');
});
document.getElementById('setClose').addEventListener('click', ()=>{ sfx('tap'); ovlSet.hidden = true; });
document.getElementById('setReset').addEventListener('click', ()=>{ sfx('tap'); ovlSet.hidden = true; ovl.hidden = false; });
ovlSet.addEventListener('click', e=>{ if(e.target===ovlSet) ovlSet.hidden = true; });

function doReset(){
  try{ localStorage.removeItem('kuma_prog_save_v1'); }catch(e){}
  try{ if(window.Save&&Save.resetAll) Save.resetAll(['manekko','kimari','katachi','pitagora','tomare','chigai','sokkuri','pair','uta','room']); }catch(e){}
  // Save が無い環境でも確実に消す（キーは save.js の PREFIX と同じ）
  ['manekko','kimari','katachi','pitagora','tomare','chigai','sokkuri','pair','uta','room'].forEach(ns=>{ try{ localStorage.removeItem('asobinomori:'+ns); }catch(e){} });
  sfx('whoosh');
  setTimeout(()=>location.reload(), 200);
}
document.getElementById('ovlNo').addEventListener('click', ()=>{ sfx('tap'); ovl.hidden = true; });
document.getElementById('ovlYes').addEventListener('click', doReset);
ovl.addEventListener('click', e=>{ if(e.target===ovl) ovl.hidden = true; });
</script>
